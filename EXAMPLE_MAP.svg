<!--
    Este es un mapa de ejemplo simplificado para que pruebes el sistema.
    Incluye solo algunos países principales.

    Para usar este mapa:
    1. Copia TODO este contenido (desde <svg> hasta </svg>)
    2. Pégalo dentro del <div id="world-map"> en index.html

    Después puedes reemplazarlo con un mapa más completo de Wikimedia Commons.
-->

